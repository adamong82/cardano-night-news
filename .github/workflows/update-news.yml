name: Update Cardano · Midnight News
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with: {python-version: '3.12'}
      - run: python scripts/update_news.py
        if: github.event_name != 'push'
      - name: Commit snapshot
        if: github.event_name != 'push'
        run: |
          git config user.name 'cardano-night-news bot'
          git config user.email 'actions@users.noreply.github.com'
          git add dist/data/news.json
          git diff --cached --quiet || git commit -m 'chore: update news snapshot [skip ci]'
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
